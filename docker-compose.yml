services:
  web:
    hostname: web
    build:
      context: .
      dockerfile: Dockerfile-backend
    image: crow987/avitrail:latest
    volumes:
      - ./avitrail:/app
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/avitrail
      - DEBUG=True
      - SECRET_KEY=secret
      - DJANGO_SETTINGS_MODULE=avitrail.settings.development
      # Comma-separated. Defaults shown match what development.py already
      # falls back to when unset — override these for any deployment
      # reachable at a host/port other than localhost:8000/8080/5173
      # (e.g. Portainer on a LAN IP), or the browser's Origin header won't
      # be whitelisted and requests get rejected as CORS failures.
      - CORS_ALLOWED_ORIGINS=http://localhost:8000,http://localhost:8080,http://localhost:5173
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.import-airports.schedule: "@weekly"
      ofelia.job-exec.import-airports.command: "python manage.py import_airports --yes"
      ofelia.job-exec.import-airlines.schedule: "@weekly"
      ofelia.job-exec.import-airlines.command: "python manage.py import_airlines --yes"
    command: >
      sh -c "python manage.py migrate --run-syncdb &&
             (python manage.py import_airports --yes || echo 'Airport import failed, continuing startup') &&
             (python manage.py import_airlines --yes || echo 'Airline import failed, continuing startup') &&
             gunicorn avitrail.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    hostname: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    environment:
      # Runtime override (no rebuild needed) — takes precedence over the
      # VITE_API_BASE_URL build arg above. Set this to wherever the backend
      # is actually reachable from the *browser*, e.g. http://<lan-ip>:8000/api
      # for a Portainer deployment. Must be paired with the matching origin
      # in web's CORS_ALLOWED_ORIGINS/CSRF_TRUSTED_ORIGINS above.
      - API_BASE_URL=http://localhost:8000/api
    ports:
      - 8080:80
    depends_on:
      - web
    networks:
      - default

  # Runs the ofelia.job-exec.* labels on web via `docker exec` on schedule.
  scheduler:
    image: mcuadros/ofelia:0.3.13
    hostname: scheduler
    depends_on:
      - web
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  db:
    image: postgres:15
    hostname: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=avitrail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
