<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AviTrail</title>
</head>
<body>
  <div id="app"></div>
  <!-- Generated by runtime-config-entrypoint.sh at container start; must
       load before main.js so window.__RUNTIME_CONFIG__ is available when
       the app boots. Missing in local `pnpm dev` (nginx-only file), which
       is fine — constants.js falls back to import.meta.env there. -->
  <script src="/runtime-config.js" onerror="window.__RUNTIME_CONFIG__={}"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
