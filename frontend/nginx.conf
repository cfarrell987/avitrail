server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses HTML5 history mode — fall back to index.html for any
    # path that isn't a real static file, so client-side routes survive a
    # hard refresh or a direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generated fresh by runtime-config-entrypoint.sh on every container
    # start — must never be long-cached like the hashed build assets below,
    # or a restarted container with a different $API_BASE_URL won't take
    # effect for anyone with a cached copy. Exact match ("=") takes
    # precedence over the regex location below regardless of order.
    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
